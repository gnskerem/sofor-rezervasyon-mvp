<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acente - Şoför Yönetim Paneli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .status-badge { width: 15px; height: 15px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .available { background-color: #28a745; }
    .busy { background-color: #dc3545; }
    .card { margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>🚕 Şoför Rezervasyon Paneli</h1>
    <button class="btn btn-primary" onclick="loadDrivers()">Listeyi Yenile</button>
  </div>

  <div class="row">
    <!-- Şoför Listesi -->
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-dark text-white">Aktif Şoförler</div>
        <div class="card-body">
          <table class="table table-hover">
            <thead>
            <tr>
              <th>ID</th>
              <th>İsim</th>
              <th>Puan</th>
              <th>Durum</th>
              <th>Konum</th>
              <th>İşlem</th>
            </tr>
            </thead>
            <tbody id="driverTable">
            <!-- Veriler JavaScript ile buraya dolacak -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Rezervasyon Yapma Formu -->
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">Hızlı Rezervasyon</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Müşteri Adı</label>
            <input type="text" id="custName" class="form-control" placeholder="Örn: Eren">
          </div>
          <div class="mb-3">
            <label class="form-label">Enlem (Lat)</label>
            <input type="number" id="lat" class="form-control" value="41.02">
          </div>
          <div class="mb-3">
            <label class="form-label">Boylam (Lng)</label>
            <input type="number" id="lng" class="form-control" value="28.98">
          </div>
          <button class="btn btn-success w-100" onclick="makeBooking()">Rezervasyon Oluştur</button>
        </div>
      </div>
      <div id="resultAlert" class="mt-3"></div>
    </div>
  </div>
</div>

<script>
  // Sayfa açıldığında şoförleri otomatik yükle
  window.onload = loadDrivers;

  // 1. Şoförleri Listeleme Fonksiyonu
  function loadDrivers() {
      fetch('/reservations/drivers')
          .then(res => res.json())
          .then(data => {
              const table = document.getElementById('driverTable');
              table.innerHTML = '';

              data.forEach(d => {
                  // Şoför meşgulse "İşi Bitir" butonu gösterilir
                  const actionButton = d.available
                      ? '<span class="text-muted">-</span>'
                      : `<button class="btn btn-sm btn-outline-warning" onclick="releaseDriver(${d.id})">İşi Bitir</button>`;

                  const statusBadge = d.available
                      ? '<span class="status-badge available"></span>Müsait'
                      : '<span class="status-badge busy"></span>Meşgul';

                  table.innerHTML += `
                      <tr>
                          <td>${d.id}</td>
                          <td><strong>${d.name}</strong></td>
                          <td>⭐ ${d.rating}</td>
                          <td>${statusBadge}</td>
                          <td class="small text-muted">${d.latitude.toFixed(3)}, ${d.longitude.toFixed(3)}</td>
                          <td>${actionButton}</td>
                      </tr>
                  `;
              });
          })
          .catch(err => console.error("Tablo yüklenirken hata:", err));
  }

  // 2. Rezervasyon Oluşturma Fonksiyonu
  function makeBooking() {
      const requestData = {
          customerName: document.getElementById('custName').value,
          pickupLat: parseFloat(document.getElementById('lat').value),
          pickupLng: parseFloat(document.getElementById('lng').value)
      };

      // Önce rezervasyonu oluştur (PENDING)
      fetch('/reservations/reservation', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(requestData)
      })
      .then(res => {
          if (!res.ok) throw new Error("Rezervasyon oluşturulamadı!");
          return res.json();
      })
      .then(reservation => {
          // Sonra şoförü ata
          return fetch(`/reservations/assign/${reservation.id}`, { method: 'POST' });
      })
      .then(res => res.json())
      .then(data => {
          const alert = document.getElementById('resultAlert');
          alert.innerHTML = `
              <div class="alert alert-info shadow-sm">
                  ✅ <strong>Rezervasyon Başarılı!</strong><br>
                  <small>Rezervasyon ID: ${data.id}</small><br>
                  <small>Atanan Şoför ID: ${data.assignedDriverId || 'Aranıyor...'}</small><br>
                  <small>Durum: ${data.status}</small>
              </div>
          `;
          loadDrivers(); // Tabloyu anlık yenile
      })
      .catch(err => {
          const alert = document.getElementById('resultAlert');
          alert.innerHTML = `<div class="alert alert-danger shadow-sm">❌ Hata: ${err.message}</div>`;
      });
  }

  // 3. Şoförü Serbest Bırakma Fonksiyonu
  function releaseDriver(driverId) {
      fetch(`/reservations/driver/${driverId}/release`, { method: 'POST' })
          .then(res => {
              if (res.ok) {
                  loadDrivers(); // Başarılıysa tabloyu yenile
              } else {
                  alert("Şoför serbest bırakılamadı!");
              }
          })
          .catch(err => console.error("Hata:", err));
  }
</script>
</body>
</html>
