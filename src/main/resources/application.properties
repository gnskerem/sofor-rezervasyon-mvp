# =============================================
# H2 In-Memory Database Ayarlar覺
# Uygulama kapan覺nca veriler s覺f覺rlan覺r (MVP i癟in yeterli)
# =============================================
spring.datasource.url=jdbc:h2:mem:driverdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console: http://localhost:8080/h2-console adresinden veritaban覺n覺 g繹rebilirsin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Hibernate tablolar? olu?tursun, sonra data.sql 蓷l??s?n
spring.jpa.defer-datasource-initialization=true

# Uygulama portu
server.port=8080
