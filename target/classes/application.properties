# =============================================
# H2 In-Memory Database Ayarları
# Uygulama kapanınca veriler sıfırlanır (MVP için yeterli)
# =============================================
spring.datasource.url=jdbc:h2:mem:driverdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console: http://localhost:8080/h2-console adresinden veritabanını görebilirsin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Hibernate tablolar? olu?tursun, sonra data.sql �al??s?n
spring.jpa.defer-datasource-initialization=true

# Uygulama portu
server.port=8080
